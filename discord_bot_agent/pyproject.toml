[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-bot-agent"
version = "0.1.0"
description = "Agente para conexão com bot do Discord"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "MIT Agent" }
]
dependencies = [
  "discord.py>=2.3.2",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.3.0",
  "mypy>=1.8.0"
]

[project.scripts]
discord-bot-agent = "discord_bot_agent.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
